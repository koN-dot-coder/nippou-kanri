<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ページが見つかりません | ひとめ日報</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <!-- Rails を通らずに表示されるので、CSS はこのファイルの中に書いています（404・422・500・406 で共通） -->
  <style>
    body {
      margin: 0;
      background: #f4f4f6;
      color: #16202b;
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }
    .site-header {
      background: #16202b;
      padding: 14px 20px;
    }
    .app-name {
      color: #ffffff;
      font-weight: bold;
      font-size: 18px;
      text-decoration: none;
    }
    .error-box {
      max-width: 480px;
      margin: 64px auto 0;
      padding: 32px 24px;
      border: 1px solid #d1d1d6;
      border-top: 3px solid #114665;
      border-radius: 4px;
      background: #ffffff;
      text-align: center;
    }
    .error-code {
      margin: 0;
      font-size: 13px;
      color: #5c606b;
    }
    h1 {
      margin: 4px 0 12px;
      font-size: 20px;
    }
    p {
      margin: 0 0 24px;
      color: #5c606b;
    }
    .button {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 4px;
      background: #114665;
      color: #ffffff;
      text-decoration: none;
    }
    @media (max-width: 600px) {
      .error-box {
        margin: 32px 16px 0;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="app-name">ひとめ日報</a>
  </header>
  <main class="error-box">
    <p class="error-code">404</p>
    <h1>ページが見つかりません</h1>
    <p>URL がまちがっているか、見る権限のない日報の可能性があります。</p>
    <a href="/" class="button">トップへ戻る</a>
  </main>
</body>
</html>
